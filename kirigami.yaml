# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/php-kirigami/kirigami@main/packages/kirigami/kirigami.schema.json

kirigami:
  project:     Kirigami Demo
  baseurl:     https://php-kirigami.github.io/template-demo
  root:        src
  banner:      banner.txt

  # Free-form project data — available as PHP variables on every page.
  author:      The Kirigami Team
  email:       hello@example.com
  description: >-
    A guided tour of Kirigami — the zero-dependency static site generator that
    compiles PHP page templates to plain HTML, running PHP 8.5 in WebAssembly.
  keywords:    [static site generator, php, webassembly, kirigami, zero dependency]
  tagline:     Fold PHP into flat HTML.


image:
  format: webp          # avif currently fails to encode at many sizes in the WASM build
  source: assets/images
  dest:   images


# SEO / social metadata. This block opts @kirigami/php-prepros' META class in;
# an empty map is enough — <title>, description, keywords, Open Graph, Twitter
# Card, canonical, favicon and apple-touch-icon are derived from the `kirigami:`
# keys above and each page's PHPDOC (@title, @description, @image, @robots, …).
# Any tag _layout/header.php already writes by hand is detected and skipped.
meta: {}


prepros:
  network:  true
  format:   true         # pretty-print output; <pre>/<textarea> kept verbatim since @kirigami/php-prepros 1.4.0
  before:   _layout/header.php
  after:    _layout/footer.php
  includes: [_lib/functions.php]


plugins:
  # Build-time syntax highlighting. The `prepros:html` hook bakes the
  # highlight.js `.hljs-*` spans into every fenced block; `sass:after` appends
  # the theme + embedded JetBrains Mono @font-face + copy-button styles;
  # `esbuild:after` folds the ~1 KB copy-button script into `js-core`; and
  # `prepros:php` registers the <highlight lang="…"> authoring tag.
  # Nothing highlight.js-related is shipped to the browser.
  - name: "@kirigami/plugin-highlight"
    active: true
    options:
      languages: [php, javascript, bash, shell, json, yaml, css, scss, xml, markdown]
      theme: auto
      copyButton: true   # needs an esbuild task — we have `js-core` below
      tag: true

  # <extlink src="…"> — a SCRAPER-backed external link preview card. Scrape
  # result + downloaded thumbnail are cached to disk (_data/extlink/,
  # assets/images/extlink/) and committed, so a rebuild never re-crawls a URL
  # it has already resolved. Needs `prepros.network: true` above.
  - name: "@kirigami/plugin-extlink"
    active: true

  # <youtube id="…"> / <vimeo id="…"> — oEmbed video cards, entirely
  # client-side (no build-time network call). The observer script bundled
  # into `js-core` fetches the oEmbed data on load (localStorage-cached) and
  # wires a click-to-play button.
  - name: "@kirigami/plugin-embed"
    active: true


sass:
  style: expanded


tasks:
  - name: js-core
    type: esbuild
    entry: scripts/kirigami.core.js

  - name: css-core
    type: sass
    entry: styles/kirigami.core.scss
